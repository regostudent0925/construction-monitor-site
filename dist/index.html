<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>건설산업 모니터링</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><header><div class="brand">CONSTRUCTION INTELLIGENCE <span>분류체계 v1.0</span></div><h1>건설산업 모니터링</h1><p>산업의 변화, 인력의 미래, 연구의 흐름을 한곳에서.</p><div class="notice">개인 열람용 · 자동 수집 보고서는 검토 전 초안입니다. 원문 확인·사용자 승인·대외 공개는 별도 단계입니다.</div></header><main><section id="schedule" class="cards" aria-label="보고 주기"></section><section class="toolbar" aria-label="검색"><label>보고 유형<select id="kind"><option value="">전체 보고서</option><option value="daily">A~D 데일리</option><option value="weekly">E-1 주간 연구</option><option value="monthly">E-2 월간 학술지</option></select></label><label>분류<select id="category"><option value="">전체 분류</option></select></label><label class="search">검색어<input id="query" placeholder="제목·요약·출처·DOI 검색"></label><label>시작일<input id="from" type="date"></label><label>종료일<input id="to" type="date"></label><label class="check"><input id="history" type="checkbox">수정 이력 포함</label></section><div id="status" role="status">보고서를 불러오는 중입니다.</div><div class="layout"><section id="reports" aria-label="보고서 목록"></section><article id="detail"><h2>보고서를 선택해 주세요</h2><p>원문 링크, 게시일과 발생일, 확인 한계와 수정 이력을 열람할 수 있습니다.</p></article></div><details class="scope"><summary>모니터링 대상·집계 기준</summary><div id="scope"></div></details></main><footer>출처 중심 아카이브 · 개별 연구과제 자동 연결 제외 · <span id="built"></span></footer></body></html>
